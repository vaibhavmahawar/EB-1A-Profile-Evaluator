[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eb1a-evaluator"
version = "0.1.0"
description = "A grounded prototype for evaluating EB-1A candidate profiles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "chromadb>=0.5,<2",
    "httpx>=0.27,<1",
    "openai>=1,<3",
    "pypdf>=5,<7",
    "pydantic>=2.7,<3",
    "sentence-transformers>=3,<6",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
